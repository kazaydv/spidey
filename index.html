<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Spidey — Siddhu's Assistant</title>
<meta name="theme-color" content="#050914">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- LOGIN GATE -->
<section id="loginScreen" class="screen">
  <div class="logoOrb small"><div class="core"></div></div>
  <h1>SPIDEY</h1>
  <p class="sub">Siddhu&rsquo;s personal assistant.<br>Private — one user only.</p>
  <div id="googleBtnWrap"></div>
  <p id="loginMsg" class="msg"></p>
  <button id="previewBtn" class="ghost hidden">Enter preview (no login configured yet)</button>
  <p class="tiny">Spidey v1</p>
</section>

<!-- MAIN HUD -->
<section id="hudScreen" class="screen hidden">
  <header>
    <div class="brand"><span class="dot"></span> SPIDEY</div>
    <div id="connState" class="conn">offline brain</div>
    <button id="signOutBtn" class="ghost smallBtn">Sign out</button>
  </header>

  <div class="cards">
    <div class="card"><div class="cardLabel">Today&rsquo;s orders</div><div class="cardValue" id="cardOrders">—</div></div>
    <div class="card"><div class="cardLabel">Revenue today</div><div class="cardValue" id="cardRevenue">—</div></div>
    <div class="card"><div class="cardLabel">College mail</div><div class="cardValue" id="cardMail">—</div></div>
  </div>

  <div class="orbWrap" id="orbWrap" data-state="idle">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="core" id="orbCore"></div>
  </div>
  <p id="stateText" class="stateText">Tap the core and talk, or say &ldquo;Hey Spidey&rdquo;</p>
  <p id="liveText" class="liveText"></p>

  <div class="controls">
    <button id="talkBtn" class="primary">🎙 Talk to Spidey</button>
    <button id="wakeBtn" class="ghost">Wake word: OFF</button>
  </div>

  <div id="chatLog" class="chatLog"></div>

  <form id="textForm" class="textForm">
    <input id="textInput" type="text" placeholder="Or type here… English / Nepali / mixed" autocomplete="off">
    <button type="submit" class="primary sendBtn">Send</button>
  </form>
  <p class="tiny center">Spidey <span id="verFoot">v1</span> · work + college only · reminders go to Telegram + Discord</p>
</section>

<script src="js/app.js"></script>
</body>
</html>
